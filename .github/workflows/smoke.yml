name: Smoke CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to validate
        required: false
        type: string

permissions:
  contents: read

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: VAL-L2-01 Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: VAL-L2-02 Typecheck
        run: mypy src/mlops

      - name: VAL-L1 Data validation
        run: python -m mlops.cli validate-data --mode smoke

      - name: VAL-L1 Full data contract
        run: python -m mlops.cli validate-data --mode full

      - name: VAL-L2-03 Unit tests
        run: MLFLOW_DISABLED=1 pytest tests/unit tests/contract --cov=mlops --cov-report=xml --cov-report=term-missing --cov-fail-under=35

      - name: VAL-L2-04 Build train image
        run: docker build -f docker/Dockerfile.train -t mlops-train .

      - name: VAL-L2-05 Import smoke
        run: docker run --rm --entrypoint python mlops-train -c "import mlops"

      - name: VAL-L2-06 MLflow ping
        if: ${{ env.MLFLOW_TRACKING_URI != '' }}
        run: python -m mlops.cli mlflow-ping

      - name: VAL-L2-07 Mini train
        run: bash scripts/smoke_mini_train.sh

      - name: VAL-L2-08 Artifact exists
        run: test -s model.pkl

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
        if: always()

      - name: Publish validation summary
        if: always()
        run: |
          {
            echo '## Atlas smoke validation'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "External MLflow: $([ -n \"$MLFLOW_TRACKING_URI\" ] && echo enabled || echo disabled)"
            echo "Model artifact: $(sha256sum model.pkl 2>/dev/null || echo unavailable)"
          } >> "$GITHUB_STEP_SUMMARY"
