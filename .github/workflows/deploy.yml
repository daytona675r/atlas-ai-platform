name: Deploy

on:
  workflow_run:
    workflows: [Full Train]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful Full Train workflow run ID containing the candidate artifact
        required: true
        type: string
      production:
        description: Promote the verified candidate to the production alias
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  configuration:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      source_run_id: ${{ steps.check.outputs.source_run_id }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      smoke_run_id: ${{ steps.check.outputs.smoke_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation helpers
        run: pip install -e "."
      - id: check
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          RENDER_RELEASE_BRANCH: ${{ vars.RENDER_RELEASE_BRANCH }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          if [[ -z "$SOURCE_RUN_ID" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing exact Full Train source run ID." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > source-run.json
          python - <<'PY'
          import json
          data = json.load(open("source-run.json"))
          if data.get("name") != "Full Train" or data.get("status") != "completed" or data.get("conclusion") != "success":
              raise SystemExit("source run must be a completed successful Full Train run")
          print(data["head_sha"])
          PY
          echo "source_sha=$(python -c 'import json; print(json.load(open("source-run.json"))["head_sha"])')" >> "$GITHUB_OUTPUT"
          SOURCE_SHA=$(python -c 'import json; print(json.load(open("source-run.json"))["head_sha"])')
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/smoke.yml/runs?head_sha=${SOURCE_SHA}&per_page=100" > smoke-runs.json
          python scripts/validate_smoke_run.py --runs-json smoke-runs.json --commit-sha "$SOURCE_SHA" > smoke-result.json
          echo "smoke_run_id=$(python -c 'import json; print(json.load(open("smoke-result.json"))["id"])')" >> "$GITHUB_OUTPUT"
          if [[ -z "$RENDER_SERVICE_URL" || -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "Render deployment is not configured. Set RENDER_SERVICE_URL and the RENDER_DEPLOY_HOOK secret." >&2
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Render deployment is configured for branch ${RENDER_RELEASE_BRANCH:-render-release}."

  deploy:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    outputs:
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.configuration.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      - name: Download exact validated candidate
        uses: actions/download-artifact@v4
        with:
          name: model
          path: candidate
          run-id: ${{ needs.configuration.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate candidate handoff
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s candidate/model.pkl
          test -s candidate/candidate-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ needs.configuration.outputs.source_run_id }}" > source-run.json
          cp candidate/model.pkl model.pkl
          cp candidate/candidate-metadata.json candidate-metadata.json
          python scripts/validate_candidate.py \
            --run-json source-run.json \
            --metadata candidate-metadata.json \
            --model candidate/model.pkl \
            --requested-run-id "${{ needs.configuration.outputs.source_run_id }}" > candidate-result.json
          test "$(git rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("candidate-result.json"))["commit_sha"])')"
          echo "run_id=$(python -c 'import json; print(json.load(open("candidate-result.json"))["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(python -c 'import json; print(json.load(open("candidate-result.json"))["commit_sha"])')" >> "$GITHUB_OUTPUT"
          echo "model_sha256=$(python -c 'import json; print(json.load(open("candidate-metadata.json"))["model_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Build and verify serving artifact locally
        run: |
          docker build -f docker/Dockerfile.serve -t mlops-serve .
          docker compose -f docker/docker-compose.verify.yml up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          EXPECTED_COMMIT_SHA="$(python -c 'import json; print(json.load(open("candidate-result.json"))["commit_sha"])')" \
          EXPECTED_SOURCE_RUN_ID="${{ needs.configuration.outputs.source_run_id }}" \
          EXPECTED_MLFLOW_RUN_ID="$(python -c 'import json; print(json.load(open("candidate-result.json"))["run_id"])')" \
          EXPECTED_MODEL_SHA256="$(python -c 'import json; print(json.load(open("candidate-metadata.json"))["model_sha256"])')" \
          SERVE_URL=http://localhost:8000 python scripts/verify_deploy.py
          docker compose -f docker/docker-compose.verify.yml down

      - name: Publish immutable Render release branch
        env:
          RENDER_RELEASE_BRANCH: ${{ vars.RENDER_RELEASE_BRANCH || 'render-release' }}
          SOURCE_SHA: ${{ needs.configuration.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$RENDER_RELEASE_BRANCH" || true
          git checkout -B "$RENDER_RELEASE_BRANCH" "$SOURCE_SHA"
          test -s model.pkl
          test -s candidate-metadata.json
          git add model.pkl candidate-metadata.json
          git commit -m "Render release $SOURCE_SHA" || echo "Release artifacts already present"
          git push --force-with-lease origin "HEAD:refs/heads/$RENDER_RELEASE_BRANCH"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK" > render-deploy.json
          cat render-deploy.json

      - name: Wait for hosted health and verify golden contract
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_COMMIT_SHA: ${{ steps.candidate.outputs.commit_sha }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.configuration.outputs.source_run_id }}
          EXPECTED_MLFLOW_RUN_ID: ${{ steps.candidate.outputs.run_id }}
          EXPECTED_MODEL_SHA256: ${{ steps.candidate.outputs.model_sha256 }}
        run: |
          set -euo pipefail
          export SERVE_URL="${RENDER_SERVICE_URL%/}"
          ready=false
          for i in $(seq 1 60); do
            if curl -sf "$SERVE_URL/health"; then ready=true; break; fi
            sleep 10
          done
          [[ "$ready" == true ]]
          curl --fail --silent --show-error "$SERVE_URL/health"
          SERVE_URL="$SERVE_URL" python scripts/verify_deploy.py

      - name: Deployment summary
        if: always()
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          {
            echo '## Atlas staging deployment'
            echo "Candidate commit: $(python -c 'import json; print(json.load(open("candidate-result.json"))["commit_sha"])' 2>/dev/null || echo unavailable)"
            echo "Source Full Train run: ${{ needs.configuration.outputs.source_run_id }}"
            echo "Candidate metadata: $(cat candidate-metadata.json 2>/dev/null || echo unavailable)"
            echo "Render service: ${RENDER_SERVICE_URL}"
            echo 'Hosted Layer 4 verification runs before any promotion step.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Promote exact verified candidate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          CANDIDATE_RUN_ID: ${{ needs.deploy.outputs.candidate_run_id }}
        run: |
          test -n "$MLFLOW_TRACKING_URI"
          test -n "$CANDIDATE_RUN_ID"
          python - <<'PY'
          import os
          import mlflow
          from mlflow.tracking import MlflowClient
          from mlops.config import REPO_ROOT, load_yaml

          model_name = load_yaml(REPO_ROOT / "configs/validation_thresholds.yaml")["registry_model_name"]
          client = MlflowClient()
          versions = client.search_model_versions(f"name='{model_name}'")
          matches = [version for version in versions if version.run_id == os.environ["CANDIDATE_RUN_ID"]]
          if not matches:
              raise SystemExit("exact verified candidate is not registered; refusing promotion")
          version = matches[-1]
          client.set_registered_model_alias(model_name, "production", version.version)
          print(f"promoted {model_name} v{version.version} from {version.run_id}")
          PY
