name: Deploy

on:
  workflow_run:
    workflows: [Full Train]
    types: [completed]
  workflow_dispatch:
    inputs:
      production:
        description: Promote the verified candidate to the production alias
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  configuration:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_SPACE_REPO" && -n "$HF_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "HF Space deployment is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: configure HF_SPACE_REPO and HF_TOKEN before enabling hosted CD." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: configuration
    if: needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "[dev]" huggingface_hub

      - name: Download exact validated candidate
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: model
          path: candidate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create explicit candidate for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          MLFLOW_DISABLED=1 python -m mlops.cli train --config configs/smoke.yaml > candidate-run-id
          mkdir -p candidate
          cp model.pkl candidate/model.pkl
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          Path("candidate/candidate-metadata.json").write_text(json.dumps({
              "commit_sha": os.environ["GITHUB_SHA"],
              "source_workflow": os.environ["GITHUB_WORKFLOW"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "run_id": Path("candidate-run-id").read_text().strip(),
              "model_sha256": hashlib.sha256(Path("candidate/model.pkl").read_bytes()).hexdigest(),
          }, indent=2) + "\n")
          PY

      - name: Validate candidate handoff
        run: |
          test -s candidate/model.pkl
          test -s candidate/candidate-metadata.json
          cp candidate/model.pkl model.pkl
          cp candidate/candidate-metadata.json candidate-metadata.json
          python -c 'import json; d=json.load(open("candidate-metadata.json")); assert d["run_id"] and d["model_sha256"]'

      - name: Build and verify serving artifact locally
        run: |
          docker build -f docker/Dockerfile.serve -t mlops-serve .
          docker compose -f docker/docker-compose.verify.yml up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          SERVE_URL=http://localhost:8000 python scripts/verify_deploy.py
          docker compose -f docker/docker-compose.verify.yml down

      - name: Deploy Docker Space
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf-space
          cp docker/Dockerfile.serve hf-space/Dockerfile
          cp model.pkl candidate-metadata.json pyproject.toml README.md hf-space/
          cp -r src configs hf-space/
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile model.pkl candidate-metadata.json pyproject.toml README.md src configs
          git commit -m "Deploy validated candidate ${GITHUB_SHA}" || echo "No Space changes"
          git push origin HEAD:main

      - name: Wait for hosted health and verify golden contract
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          export SERVE_URL="https://$(echo "$HF_SPACE_REPO" | tr '/' '-')"
          for i in $(seq 1 60); do curl -sf "$SERVE_URL/health" && break; sleep 10; done
          curl --fail --silent --show-error "$SERVE_URL/health"
          SERVE_URL="$SERVE_URL" python scripts/verify_deploy.py

      - name: Deployment summary
        if: always()
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          {
            echo '## Atlas staging deployment'
            echo "Commit: $GITHUB_SHA"
            echo "Source workflow run: ${{ github.event.workflow_run.id || github.run_id }}"
            echo "Candidate metadata: $(cat candidate-metadata.json 2>/dev/null || echo unavailable)"
            echo "Target Space: https://huggingface.co/spaces/${HF_SPACE_REPO}"
            echo 'Hosted verification runs before any promotion step.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-production:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          echo 'Production promotion is intentionally gated behind the staging verification job.'
          echo 'Use the verified candidate run/alias in the protected MLflow environment.' >> "$GITHUB_STEP_SUMMARY"
