name: Full Train

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: VAL-L1 Data validation (full)
        run: python -m mlops.cli validate-data --mode full

      - name: Full train
        id: train
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI required for full train" >&2
            exit 1
          fi
          RUN_ID=$(python -m mlops.cli train --config configs/full.yaml | tail -1)
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: VAL-L3 Run validation
        run: python -m mlops.cli validate-run --run-id ${{ steps.train.outputs.run_id }}

      - name: Register staging
        run: python -m mlops.cli register --run-id ${{ steps.train.outputs.run_id }}

      - name: Write candidate metadata
        if: ${{ always() && steps.train.outcome == 'success' }}
        env:
          CANDIDATE_RUN_ID: ${{ steps.train.outputs.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          metadata = {
              "commit_sha": os.environ["GITHUB_SHA"],
              "source_workflow": os.environ["GITHUB_WORKFLOW"],
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "run_id": os.environ["CANDIDATE_RUN_ID"],
              "model_sha256": hashlib.sha256(Path("model.pkl").read_bytes()).hexdigest(),
          }
          Path("candidate-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            model.pkl
            candidate-metadata.json
